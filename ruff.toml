# Reglas básicas (errores de sintaxis, nombres sin definir, imports y variables sin usar, except desnudo y mutables por defecto).
# Desde la fase 0B se exigen en TODO el repo (job «lint» de .github/workflows/ci.yml y pre-commit). Sin reformatear: solo reglas de errores.
target-version = "py313"
line-length = 200

[lint]
select = ["E9", "F", "E722", "B006"]
ignore = ["F401"]        # los routers reexportan/importan por efecto lateral en varios sitios; se limpia archivo por archivo

[lint.per-file-ignores]
"alembic/versions/0017_staff_phone_unique.py" = ["F841"]   # migración antigua ya aplicada en todos los entornos: no se edita
"tests/test_seguridad_0c_lote2_b.py" = ["F811"]            # los fixtures (keys, _no_dns) se importan de test_form_payments
"tests/test_crm_cuentas_api.py" = ["F811"]                 # el fixture crm_on se importa de tests/crm_helpers.py
"tests/test_crm_contactos.py" = ["F811"]

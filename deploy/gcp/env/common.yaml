# Variables NO secretas comunes a todos los servicios y Jobs de Cloud Run (--env-vars-file). Las calculadas —buckets, cola, URLs— las
# agrega deploy.sh; los secretos vienen de Secret Manager. Datos públicos del negocio: los de la política de privacidad publicada.
ENVIRONMENT: "production"
APP_TIMEZONE: "America/Bogota"
LEGAL_ADDRESS: "Carrera 14a # 71a - 59, Bogotá"
LEGAL_PHONE: "+57 317 427 6073"
LEGAL_EMAIL: "info@goldenlogisticas.com"
LEGAL_PRIVACY_EMAIL: "info@goldenlogisticas.com"
# Retención biométrica: 7 días después de que TODOS los eventos de la persona estén finalizados; tope de 180 días desde la captura.
BIOMETRIC_RETENTION_DAYS_AFTER_EVENT: "7"
BIOMETRIC_MAX_DAYS: "180"
# Fotos biométricas bajo un prefijo común: la regla de ciclo de vida borra en 1 día sus versiones viejas (docs/15, R4).
BIOMETRIC_KEY_PREFIX: "biometric"
RECOGNITION_JITTERS: "2"
# Caso dudoso del reconocimiento: 0,10 atrapó el único falso positivo del conjunto abierto a costa de 2,1 % de escaneos por verificar (docs/14 §6.3).
MATCH_MARGIN: "0.10"
# Detrás de Firebase Hosting solo pasa la cookie «__session», y CF-Connecting-IP no es confiable (Cloudflare solo como DNS).
SESSION_COOKIE: "__session"
TRUST_CF_CONNECTING_IP: "0"
# Posición de la IP real en X-Forwarded-For detrás de Firebase: VERIFICAR en staging (sesión 3) y ajustar.
XFF_CLIENT_INDEX: "0"
DEPLOY_FREEZE_HOURS: "3"
# Cloud Run y Firebase ponen X-Forwarded-Proto=https: se confía en ellos para que la app sepa que la petición llegó por https (redirecciones).
FORWARDED_ALLOW_IPS: "*"

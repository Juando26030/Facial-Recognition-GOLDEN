# Configuración de referencia de Nginx en la VM: /etc/nginx/sites-enabled/golden  (Sprint 4, ítem 2).
# Es una COPIA para poder reconstruir la VM; el archivo real vive en la VM (los bloques "managed by Certbot" los
# mantiene Certbot). Si cambias algo en la VM, actualiza esta copia.
#
# Por qué estos valores: `client_max_body_size` 500M — el default de Nginx (1M) rechazaba con 413 la carga de bases
# con fotos; Cloudflare, de todos modos, topa cada request en 100 MB (planes no Enterprise), por eso la carga masiva
# se divide sola en lotes desde el navegador (kiosk_roster.html). Los timeouts de 300 s cubren un lote de fotos.
server {
    server_name golden.juandajuzga.com;

    client_max_body_size 500M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/golden.juandajuzga.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/golden.juandajuzga.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = golden.juandajuzga.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name golden.juandajuzga.com;
    return 404; # managed by Certbot
}

name: Deploy to production

# Sprint 4, ítem 2. Cambios frente a la versión anterior:
# - Pruebas primero (ci.yml): si fallan, no se toca producción.
# - Se quitó `sudo apt-get`: en el runner ese sudo se negaba ("sudo: I'm sorry ... I'm afraid I can't do that") y
#   dejaba a medias pip / alembic / reinicio en cada deploy. Lo único que la VM permite SIN contraseña de forma
#   explícita (regla de sudoers) es `systemctl restart|is-active|status facial-recognition`, y eso es lo único que
#   este workflow usa con sudo. Tesseract ya está instalado en la VM; ahora solo se VERIFICA.
# - Backup automático de la base (local + bucket) antes de migrar; si falla, no se despliega.
# - Un solo deploy a la vez, y el reinicio comprueba que la app responde 200 (si no, el deploy queda en rojo).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Pull latest main
        run: |
          set -e
          cd ~/Facial-Recognition
          git fetch origin main
          git reset --hard origin/main

      - name: Backup de la base ANTES de tocar nada (local + bucket)
        # Si este paso falla, el deploy se detiene: nunca se migra sin una copia externa reciente. Nombres de bucket: no son secretos.
        env:
          GCS_BUCKET: gs://golden-backups-analisis-de-imagen-id
          DB_ONLY: "1"
          TAG: pre_deploy
        run: |
          set -e
          cd ~/Facial-Recognition
          bash scripts/backup_db.sh

      - name: Verify system dependencies (Tesseract OCR)
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            echo "::error::tesseract-ocr no está instalado en la VM. Instálalo UNA vez a mano: sudo apt-get install -y tesseract-ocr"
            exit 1
          fi
          tesseract --version | head -1

      - name: Install dependencies
        run: |
          set -e
          cd ~/Facial-Recognition
          venv/bin/pip install -q -r requirements.txt

      - name: Run database migrations
        run: |
          set -e
          cd ~/Facial-Recognition
          venv/bin/alembic upgrade head
          venv/bin/alembic current

      - name: Restart service
        run: |
          set -e
          sudo -n systemctl restart facial-recognition
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/login || true)
            if [ "$code" = "200" ]; then echo "app respondiendo: 200 (intento $i)"; sudo -n systemctl is-active facial-recognition; exit 0; fi
            sleep 2
          done
          echo "::error::La app no respondió 200 tras reiniciar (último código: $code)"
          sudo -n /usr/bin/systemctl status facial-recognition | tail -20 || true
          exit 1

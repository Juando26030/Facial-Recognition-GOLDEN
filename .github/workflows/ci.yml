name: CI (pruebas)

# Corre las pruebas automáticas en cada push a cualquier rama y en cada PR (Sprint 4, ítem 4). Usa runners de GitHub
# (NO el runner self-hosted de producción), así un PR externo nunca ejecuta código en la VM. También lo invoca el
# deploy: si las pruebas fallan, no se llega ni a migrar ni a reiniciar.
on:
  push:
    branches-ignore: ["diag/**"]          # las ramas diag/* tienen su propio flujo corto (diag.yml)
  pull_request:
  workflow_call:

# Un push nuevo a la misma rama cancela la corrida anterior (ahorra minutos de Actions). Nunca en main: ahí corre antes de un despliegue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # revisión 22-nov-2026: una prueba colgada (base que no responde) no retiene el runner las 6 h por defecto
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # La base de pruebas se crea sola (golden_test); nunca se toca ninguna otra.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/golden_db
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: "Instalar dependencias (sin dlib/face-recognition; las pruebas usan un doble del motor biométrico)"
        run: |
          grep -viE '^(face[-_]recognition|dlib)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest httpx pyyaml      # pyyaml: solo lo usa tests/test_cutover_workflows.py (lee los flujos de GitHub); no es dependencia de la app
      - name: Pruebas
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Dependencias de las pruebas de JS (jsdom, versión fija)
        run: npm ci
      - name: Pruebas de JS (DOM falso o jsdom, sin navegador)
        run: for f in tests/js/*_check.js; do node "$f" || exit 1; done

  image:
    # Construye la imagen de Cloud Run SIN subirla, en las ramas de trabajo y de la migración: así un error del Dockerfile (p. ej. un comentario al final de una instrucción, que Docker toma como argumentos)
    # salta aquí y no en pleno despliegue de staging. La compilación de dlib queda en caché de GitHub Actions: después de la primera vez tarda pocos minutos.
    # 22-nov-2026: también `feat/` (la rama de la corrida final que aprueba Juan David antes de producción) y `saas/`: así el Dockerfile se comprueba ANTES del despliegue, no durante.
    if: startsWith(github.ref_name, 'integracion/') || startsWith(github.ref_name, 'migra/') || startsWith(github.ref_name, 'producto/') || startsWith(github.ref_name, 'feat/') || startsWith(github.ref_name, 'saas/')
    runs-on: ubuntu-latest
    timeout-minutes: 90          # la primera compilación de dlib sin caché tarda 20-60 min
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Revisión rápida del Dockerfile (sintaxis y buenas prácticas)
        run: docker buildx build --check .
      - name: Construir la imagen (sin subirla)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    # Ruff con reglas básicas (ruff.toml) sobre TODO el repo (desde la fase 0B). Sin reformatear: solo errores reales (sintaxis, nombres sin
    # definir, variables sin usar, `except:` desnudo, mutables por defecto).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.9          # MISMA versión que .pre-commit-config.yaml (rev v0.16.9) y requirements-dev.txt: al subirla, se sube en los tres
      - name: Ruff (todo el repo)
        run: ruff check .

name: CI (pruebas)

# Corre las pruebas automáticas en cada push a cualquier rama y en cada PR (Sprint 4, ítem 4). Usa runners de GitHub
# (NO el runner self-hosted de producción), así un PR externo nunca ejecuta código en la VM. También lo invoca el
# deploy: si las pruebas fallan, no se llega ni a migrar ni a reiniciar.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # La base de pruebas se crea sola (golden_test); nunca se toca ninguna otra.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/golden_db
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: "Instalar dependencias (sin dlib/face-recognition; las pruebas usan un doble del motor biométrico)"
        run: |
          grep -viE '^(face[-_]recognition|dlib)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest httpx
      - name: Pruebas
        run: python -m pytest -q
      - name: Pruebas de JS (DOM falso, sin navegador)
        run: for f in tests/js/*_check.js; do node "$f" || exit 1; done

  image:
    # Construye la imagen de Cloud Run SIN subirla, en las ramas de trabajo y de la migración: así un error del Dockerfile (p. ej. un comentario al final de una instrucción, que Docker toma como argumentos)
    # salta aquí y no en pleno despliegue de staging. La compilación de dlib queda en caché de GitHub Actions: después de la primera vez tarda pocos minutos.
    if: startsWith(github.ref_name, 'integracion/') || startsWith(github.ref_name, 'migra/') || startsWith(github.ref_name, 'producto/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Revisión rápida del Dockerfile (sintaxis y buenas prácticas)
        run: docker buildx build --check .
      - name: Construir la imagen (sin subirla)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    # Ruff con reglas básicas (ruff.toml) SOLO sobre los archivos .py nuevos o modificados respecto a la base: no se reformatea ni se
    # arregla todo el repo de golpe, pero nada nuevo entra con imports rotos, nombres sin definir o `except:` desnudos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Ruff (solo archivos nuevos o tocados)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then base="origin/main"; fi
          files=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- '*.py' || true)
          if [ -z "$files" ]; then echo "Sin archivos .py cambiados"; exit 0; fi
          echo "$files"
          ruff check $files

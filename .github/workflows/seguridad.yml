name: Seguridad (escáneres)

# Fase 0C. Escáneres automáticos y gratuitos sobre el código: secretos (gitleaks), dependencias vulnerables (pip-audit) y análisis estático
# (Bandit y Semgrep). Corre en cada PR, en cada push a main y a las ramas de trabajo (`feat/**`, `saas/**`, `hotfix/**`: desde el 22-nov-2026, porque lo que se despliega
# sale de esas ramas y `main` iba atrasado), cada lunes y a mano (workflow_dispatch, sobre la rama que se elija). Línea base limpia: BLOQUEAN (rojo) gitleaks (cualquier hallazgo no
# documentado en .gitleaks.toml) y Bandit de severidad ALTA; lo medio/bajo de Bandit, Semgrep y pip-audit siguen siendo informativos.
on:
  pull_request:
  push:
    branches: [main, "feat/**", "saas/**", "hotfix/**"]
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior de los escáneres (ahorra minutos); nunca en main ni en la corrida del lunes.
concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

jobs:
  secretos:
    name: Secretos (gitleaks, todo el historial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 --report-format json --report-path /repo/gitleaks.json
      - if: failure()
        name: Hallazgos (sin el valor del secreto)
        run: python3 -c "import json;[print(f['RuleID'],f['File'],f['StartLine'],f['Commit'][:8],f['Fingerprint']) for f in json.load(open('gitleaks.json'))]"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks
          path: gitleaks.json
          if-no-files-found: ignore

  dependencias:
    name: Dependencias vulnerables (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off --format columns | tee pip-audit.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.txt
          if-no-files-found: ignore

  estatico:
    name: Análisis estático (Bandit + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install bandit semgrep
      - name: Bandit (severidad media o más, informativo)
        continue-on-error: true
        run: bandit -r app scripts -ll -q -f txt -o bandit.txt || (cat bandit.txt; exit 1)
      - name: Bandit (severidad ALTA, bloquea)
        run: bandit -r app scripts -lll -q
      - name: Semgrep (reglas de Python y OWASP, informativo)
        continue-on-error: true
        run: semgrep scan --config p/python --config p/owasp-top-ten --error --metrics=off app scripts | tee semgrep.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estatico
          path: |
            bandit.txt
            semgrep.txt
          if-no-files-found: ignore

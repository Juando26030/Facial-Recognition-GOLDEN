name: Cloud Run (staging y producción)

# Staging ya NO se despliega por push (23-nov-2026: se quitó el disparador de `migra/fase1-2`, rama muerta); solo a mano, ver abajo. PRODUCCIÓN NO SE DESPLIEGA NUNCA POR UN PUSH NI
# UN MERGE: solo se lanza a mano (Actions → «Cloud Run» → Run workflow → rama `main` → escribir DESPLEGAR en «confirm»), porque este repositorio no ofrece revisores obligatorios en el Environment.
# 22-nov-2026: staging también se puede desplegar A MANO desde una rama de trabajo `feat/**` o `saas/**` (Actions → «Cloud Run» → Run workflow → elegir la rama; no hace falta escribir nada en «confirm»).
# Es a mano y no por push a propósito: hay UN solo staging y muchas ramas `feat/`; un despliegue por cada push las haría pisarse y gastaría minutos. Requiere que la cuenta de despliegue de staging acepte
# esas ramas en Workload Identity (comando de una sola vez en docs/19_GUIA_PRODUCCION.md § «Staging por GitHub Actions desde ramas feat/ y saas/»); sin eso, el paso de autenticación falla y no se despliega nada.
# Un push a `main` solo corre las pruebas (`ci.yml` tiene su propio disparo). La VM ya NO se despliega desde `main` (deploy.yml quedó solo manual). Ver docs/legal/DESPLIEGUE_PRODUCCION_MANUAL.md.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Producción: desplegar aunque haya un evento en curso o por abrir (solo emergencias)"
        type: boolean
        default: false
      confirm:
        description: "Producción: escribe DESPLEGAR (en mayúsculas) para confirmar el despliegue"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: test
    if: github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/saas/'))
    concurrency:              # un solo despliegue de staging a la vez, venga de la rama que venga (el segundo espera; no se cancela uno a medias)
      group: cloudrun-staging
      cancel-in-progress: false
    uses: ./.github/workflows/cloudrun-deploy.yml
    with:
      env: staging

  production:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'DESPLEGAR'
    uses: ./.github/workflows/cloudrun-deploy.yml
    with:
      env: production
      force: ${{ inputs.force == true }}

name: Cloud Run (staging y producción)

# Staging se despliega solo en cada push a la rama de la migración (`migra/fase1-2`; el renombre a `staging` es un paso aparte posterior al corte). Producción se despliega en cada
# push/merge a `main` y espera la aprobación del revisor del Environment `production` (docs/15 D2.5, docs/19). La VM ya NO se despliega desde `main` (deploy.yml quedó solo manual).

on:
  push:
    branches: [migra/fase1-2, main]
  workflow_dispatch:
    inputs:
      force:
        description: "Producción: desplegar aunque haya un evento en curso o por abrir (solo emergencias)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: test
    if: github.ref == 'refs/heads/migra/fase1-2'
    uses: ./.github/workflows/cloudrun-deploy.yml
    with:
      env: staging

  production:
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cloudrun-deploy.yml
    with:
      env: production
      force: ${{ inputs.force == true }}

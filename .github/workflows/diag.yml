name: Diagnóstico de pruebas (corto)

# Solo en ramas diag/*: corre SOLO los archivos de prueba que se están limpiando y, de cada respuesta HTTP de error, imprime el cuerpo
# (las pruebas viejas solo dicen «KeyError»). Sirve para arreglar muchas pruebas de una vez y dejar una sola corrida completa al final.
on:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/golden_db
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias
        run: |
          grep -viE '^(face[-_]recognition|dlib)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest httpx pyyaml
      - name: Complemento que imprime el cuerpo de cada respuesta de error
        run: |
          cat > /tmp/diagplug.py <<'PY'
          from starlette.testclient import TestClient
          _orig = TestClient.request
          def _req(self, method, url, **kw):
              r = _orig(self, method, url, **kw)
              if r.status_code >= 400:
                  print(f"DIAG {method} {url} -> {r.status_code} {r.text[:300]}")
              return r
          TestClient.request = _req
          PY
      - name: Pruebas que se están limpiando
        run: |
          F=$(for f in servidor_local_descarga evento_compartido server_keys server_keys_local preprint account_sync actualizar_local ajustes_nov12 almacen_api base_archivada_guard bootstrap_iam_retry cadena_migraciones carga_por_pasos cobros_gastos_f10b_texto codigo_protegido coordinador_temporal crm_oportunidades csp_trinquete design_system event_contacts event_template fase_1_8_pedidos fase_1_9_ajustes favicon form_ya_inscrito gcloud_env_vars load_tools persona_prueba pertenencia_persona_evento publico_congelado rendimiento seguridad_cierre_permisos servidor_local_descarga vincular_local; do echo tests/test_$f.py; done)
          PYTHONPATH=/tmp python -m pytest -q -p diagplug -p no:logging -rf --tb=long $F
      - name: Dependencias de las pruebas de JS
        if: always()          # aunque las pruebas de Python hayan fallado
        run: npm ci
      - name: Pruebas de JS (todas, sin detenerse en la primera que falle)
        if: always()
        run: |
          rc=0
          for f in tests/js/*_check.js; do node "$f" >/tmp/js.out 2>&1 || { echo "FALLA $f"; tail -5 /tmp/js.out; rc=1; }; done
          exit $rc

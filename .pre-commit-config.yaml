# Revisiones rápidas antes de cada commit (opcional pero recomendado): pip install pre-commit && pre-commit install
# Las mismas reglas de ruff.toml que corre el CI. No reformatea código.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9          # MISMA versión que el job «lint» de .github/workflows/ci.yml y requirements-dev.txt: al subirla, se sube en los tres
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^deploy/

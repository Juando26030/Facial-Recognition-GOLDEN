<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | GoldenWeb 2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    {% include "_gw_head.html" %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/gw-inventory.css') }}">
    <script src="{{ url_for('static', path='js/toast.js') }}"></script>
    <script src="{{ url_for('static', path='js/idle-session.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
    <script src="{{ url_for('static', path='js/event-inventory-plan.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/inventario-page.js') }}" data-icons="{{ url_for('static', path='img/icons.svg') }}" defer></script>
</head>
<body class="gw-page gw-shell">
<a class="gw-skip" href="#contenido">Ir al contenido</a>
<header class="golden-header">
  <div class="golden-header-container">
    <a href="/" class="golden-logo">
      <img src="{{ url_for('static', path='img/logo-golden.png') }}" alt="Logo de Golden Eventos y Logística" {{ golden_logo_attrs() }}>
    </a>
    <nav class="golden-nav" aria-label="Sesión">
      {% include "_gw_theme_toggle.html" %}
      <a href="/configuracion" class="gw-btn gw-btn--ghost gw-btn--sm" aria-label="Configuración (Apariencia)" title="Configuración (Apariencia)">
        <svg class="gw-icon" aria-hidden="true"><use href="{{ url_for('static', path='img/icons.svg') }}#i-settings"/></svg>
      </a>
      <span class="gw-shell__who" title="{{ staff_name }} ({{ staff_role }})">{{ staff_name }} ({{ staff_role }})</span>
      <form action="/logout" method="post"><button type="submit" class="gw-btn gw-btn--secondary gw-btn--sm">Salir</button></form>
    </nav>
  </div>
</header>
<div class="golden-content-spacer"></div>
<main class="golden-main" id="contenido">
  <div class="gw-container gw-stack-lg">
    <div class="gw-page-head">
      <div class="gw-page-head__text">
        <p class="gw-eyebrow">Inventario</p>
        <h1 class="gw-page-head__title">Inventario de los eventos</h1>
        <p class="gw-page-head__sub">Elige un evento para ver o registrar lo asignado, lo que sale del almacén, lo que regresa y lo que se consume.</p>
      </div>
    </div>
    <div class="gw-search gw-search--hero">
      <div class="gw-search__row"><div class="gw-search__field">
        <input class="gw-input" type="search" id="invSearch" placeholder="Buscar evento por nombre o código" aria-label="Buscar evento" autocomplete="off" spellcheck="false">
      </div></div>
    </div>
    <div id="invEvents" aria-busy="true"><p class="gw-hint">Cargando eventos...</p></div>
    <section id="invPanel" hidden aria-live="polite">
      <h2 class="gw-section-title" id="invPanelTitle"></h2>
      <div id="invPlanBox"></div>
    </section>
  </div>
</main>
</body>
</html>

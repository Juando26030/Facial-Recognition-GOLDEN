<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ event_name }} — Sorteo</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/fonts-propias.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/gw-ruleta-display.css') }}">
    <script src="{{ url_for('static', path='js/roulette-render.js') }}"></script>
  <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ url_for('static', path='img/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='img/apple-touch-icon.png') }}">
</head>
<body data-gw-no-credit class="rr-display">
<div class="rr-top" id="topImages" hidden></div>
<main class="rr-layout">
    <section class="rr-info" aria-label="Sorteo">
        <img class="rr-logo" id="logo" alt="" hidden>
        <h1 class="rr-title" id="title">{{ event_name }}</h1>
        <div class="rr-rule" aria-hidden="true"></div>
        <p class="rr-label" id="label" aria-live="polite"></p>
        <button class="rr-spin" id="spinBtn" type="button" disabled>Esperando autorización…</button>
        <div class="rr-result" id="result" aria-live="polite"></div>
    </section>
    <div class="rr-stage" id="stage"></div>
</main>
<div class="rr-hint" id="hint">Pantalla de sorteo · el operador autoriza el giro y aquí se pulsa «Girar»</div>

<script>
const TOKEN = "{{ token }}";
const base = `/r/${TOKEN}`;
const assetUrl = (p) => `${base}/asset/${p}`;
let style = null, stage = null, lastSeen = null, busy = false, authorized = false, authLabel = "", idleNames = [];
let freeStop = null;          // giro libre (Fase 10, C): mientras gira sin parar, aquí está la función que lo frena (el clic en «Detener»)
const manual = () => !!style && style.spin_mode === 'manual';
let nextInfo = null, autoTimer = null, autoLeft = 0;     // fila de sorteos (11-nov-2026): cómo arranca el paso que toca («click» o solo tras una pausa) y la cuenta atrás
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function paintStyle(s) {
    style = s;
    RouletteRender.applyBackground(document.body, s, assetUrl);
    $('title').textContent = s.title || '';
    $('title').style.fontFamily = `'${s.title_font}', sans-serif`; $('title').style.color = s.title_color;
    const logo = $('logo'); logo.hidden = !s.logo; if (s.logo) logo.src = assetUrl(s.logo);
    RouletteRender.topImages($('topImages'), s, assetUrl);          // logos/banners de arriba
    document.body.classList.toggle('rr-has-top', !$('topImages').hidden);
    $('stage').className = s.wheel_style === 'jackpot' ? 'rr-stage jackpot' : 'rr-stage';
    stage = RouletteRender.stage($('stage'), s, { logoUrl: s.logo ? assetUrl(s.logo) : '' });
    stage.idle(idleNames.length ? idleNames : ['?', '?', '?', '?', '?', '?']);
    $('spinBtn').style.background = s.winner_bg; $('spinBtn').style.color = s.winner_color;
    paintButton();
}

function paintButton() {
    const b = $('spinBtn');
    if (freeStop) { b.disabled = false; b.classList.add('ready'); b.textContent = 'Detener'; }
    else if (busy) { b.disabled = true; b.classList.remove('ready'); b.textContent = 'Girando…'; }
    else if (autoTimer) { b.disabled = false; b.classList.add('ready'); b.textContent = `Gira solo en ${autoLeft} s (o pulsa ya)`; }
    else if (authorized) { b.disabled = false; b.classList.add('ready'); b.textContent = '¡Girar!' + (nextInfo && nextInfo.total > 1 ? ` · sorteo ${nextInfo.step} de ${nextInfo.total}` : ''); }
    else { b.disabled = true; b.classList.remove('ready'); b.textContent = 'Esperando autorización…'; }
    if (!busy && authorized && authLabel) $('label').textContent = authLabel;
}

async function poll() {
    try {
        const url = `${base}/state` + (lastSeen === null ? '' : `?after=${lastSeen}`);
        const st = await (await fetch(url)).json();
        if (!style || JSON.stringify(st.style) !== JSON.stringify(style)) paintStyle(st.style);
        authorized = !!st.authorized; authLabel = st.authorized_label || ''; nextInfo = st.authorized_next || null;
        if (!authorized) cancelAuto();
        if (lastSeen === null) { lastSeen = st.latest_id; }          // lo que ya estaba: no se re-anima
        else if (st.draw && !busy) { lastSeen = st.draw.id; run(st.draw); }   // otro giro (p. ej. desde otra pantalla)
        if (!busy) { scheduleAuto(); paintButton(); }
    } catch (e) { /* sin red por un momento: se reintenta */ }
}

// Un giro por ganador; entre giro y giro se muestra a quien acaba de salir.
async function run(draw, free) {
    busy = true; paintButton();
    $('label').textContent = draw.label || '';
    $('result').innerHTML = ''; $('result').className = 'rr-result ' + (draw.winners.length > 1 ? 'rr-result--multi' : 'rr-result--solo');
    for (const winner of draw.winners) {
        if (free) {                                                  // giro libre: gira hasta que alguien pulse «Detener»
            let release; const stop = new Promise((r) => { release = r; });
            freeStop = () => { freeStop = null; release(); b_frenando(); };
            paintButton();
            await stage.spin(draw.pool, winner.name, draw.spin_seconds || style.spin_seconds, { stop });
            freeStop = null;
        } else {
            await stage.spin(draw.pool, winner.name, draw.spin_seconds || style.spin_seconds);
        }
        const card = document.createElement('div'); $('result').appendChild(card);
        RouletteRender.reveal(card, winner, style);
        if (draw.winners.length > 1) await sleep(2200);
    }
    busy = false; authorized = !!draw.next; nextInfo = draw.next || null;       // en una fila, la autorización sigue viva para el paso siguiente
    if (authorized) { authLabel = draw.next.label || ''; scheduleAuto(); }
    paintButton();
}

function cancelAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
// Paso con inicio «solo»: tras la pausa que dejó el operador, gira sin que nadie pulse (el botón sigue sirviendo para adelantarlo).
function scheduleAuto() {
    if (autoTimer || busy || !authorized || !nextInfo || nextInfo.start !== 'auto') return;
    autoLeft = nextInfo.pause || 8;
    autoTimer = setInterval(() => {
        autoLeft -= 1;
        if (autoLeft <= 0) { cancelAuto(); doSpin(); } else paintButton();
    }, 1000);
    paintButton();
}

function b_frenando() { const b = $('spinBtn'); b.disabled = true; b.classList.remove('ready'); b.textContent = 'Frenando…'; }

// El botón «Girar»: pide al servidor el giro autorizado (el ganador lo decide el servidor) y lo anima de inmediato.
$('spinBtn').addEventListener('click', () => doSpin());
async function doSpin() {
    cancelAuto();
    if (freeStop) { freeStop(); return; }                           // segundo clic del giro libre: frenar
    if (busy || !authorized) return;
    busy = true; paintButton();
    try {
        const res = await fetch(`${base}/spin`, { method: 'POST' });
        const draw = await res.json().catch(() => ({}));
        if (!res.ok) { busy = false; authorized = false; paintButton(); $('label').textContent = draw.detail || 'No se pudo girar'; return; }
        lastSeen = draw.draw_id;                                        // este giro ya lo vamos a animar aquí: que el sondeo no lo repita
        busy = false; run(draw, draw.spin_mode ? draw.spin_mode === 'manual' : manual());          // cada sorteo de la fila trae su propia forma de girar
    } catch (e) { busy = false; paintButton(); }
}

poll(); setInterval(poll, 1500);
</script>
</body>
</html>

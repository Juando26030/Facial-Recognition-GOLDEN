<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reconocimiento facial voluntario</title>
<style>
  :root { --ink:#0a0e2e; --bg:#ffffff; --muted:#555; --line:#d8dce6; --accent:#0a0e2e; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f1f3fb; --bg:#0f1226; --muted:#b5b9cc; --line:#2c3150; --accent:#f1f3fb; } }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui, sans-serif; line-height:1.55; }
  main { max-width:640px; margin:0 auto; padding:18px 16px 40px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=date], input[type=file] { width:100%; box-sizing:border-box; padding:12px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; font-size:1rem; }
  button { padding:14px 20px; border-radius:10px; border:2px solid var(--accent); font-weight:700; font-size:1rem; cursor:pointer; margin:6px 8px 0 0; }
  button.primary { background:var(--accent); color:var(--bg); }
  button.secondary { background:transparent; color:var(--ink); }
  button[disabled] { opacity:.5; cursor:not-allowed; }
  .msg { margin-top:16px; padding:12px; border-radius:10px; border:1px solid var(--line); }
  p.legal { white-space:pre-line; }
  .check { display:flex; gap:10px; align-items:flex-start; font-weight:600; margin:14px 0; }
  .check input { width:20px; height:20px; margin-top:2px; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:1.3rem;">{{ event_name }}</h1>
  <section id="step1"{% if already %} hidden{% endif %}>
    <p>Si quieres entrar al evento con reconocimiento facial, completa esto antes de llegar. Es <b>totalmente voluntario</b>: sin hacerlo entras con tu cédula o QR sin ninguna restricción.</p>
    <label for="cedula">Número de documento</label>
    <input type="text" id="cedula" inputmode="numeric" autocomplete="off">
    <label for="birth">Fecha de nacimiento</label>
    <input type="date" id="birth">
    <button type="button" class="primary" id="go">Continuar</button>
  </section>
  <section id="step2" hidden>
    <h2 id="title" style="font-size:1.15rem;"></h2>
    <div id="body"></div>
    <label class="check" id="adultRow" hidden><input type="checkbox" id="adult"><span id="adultText"></span></label>
    <button type="button" class="primary" id="yes"></button>
    <button type="button" class="secondary" id="no"></button>
  </section>
  <section id="step3" hidden>
    <div id="selfieRow">
      <label for="selfie">Tu selfie (de frente, con buena luz)</label>
      <input type="file" id="selfie" accept="image/*" capture="user">
    </div>
    <button type="button" class="primary" id="send">Enviar mi selfie</button>
  </section>
  <div id="out" class="msg" role="status" aria-live="polite" hidden></div>
</main>
<script>
(function () {
  const code = {{ code|tojson }};
  const token = {{ token|tojson }};
  const channel = {{ channel|tojson }};
  const needSelfie = {{ 'true' if need_selfie else 'false' }};
  const already = {{ already|tojson }};
  const $ = (id) => document.getElementById(id);
  let block = null;
  const say = (t, bad) => { const o = $('out'); o.hidden = false; o.textContent = t; o.style.borderColor = bad ? '#c0392b' : ''; };
  const identity = () => { const fd = new FormData(); if (token) fd.append('token', token); fd.append('cedula', $('cedula').value.trim()); fd.append('birth_date', $('birth').value); return fd; };
  async function load() {
    const r = await fetch(`/api/aceptar/${encodeURIComponent(code)}/text`, { cache: 'no-store' });
    if (!r.ok) { say((await r.json().catch(() => ({}))).detail || 'No disponible', true); return null; }
    return r.json();
  }
  if (already) { $('step1').hidden = true; say(already); }          // ya aceptó: solo el estado (el servidor no manda ningún dato personal)
  // Primero la fecha de nacimiento (menores): antes de ver el texto y, sobre todo, antes de que se abra la cámara.
  $('go').addEventListener('click', async () => {
    if (!$('cedula').value.trim() || !$('birth').value) return say('Escribe tu documento y tu fecha de nacimiento.', true);
    $('go').disabled = true;
    try {
      const r = await fetch(`/api/aceptar/${encodeURIComponent(code)}/check`, { method: 'POST', body: identity() });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) return say(j.detail || 'No se pudo comprobar. Intenta de nuevo o ingresa con tu cédula o QR.', true);
      if (j.status === 'minor' || j.status === 'already') { $('step1').hidden = true; return say(j.message); }
      block = await load(); if (!block) return;
      $('title').textContent = block.title;
      const body = $('body'); body.replaceChildren();
      block.body.forEach((p) => { const e = document.createElement('p'); e.className = 'legal'; e.textContent = p; body.appendChild(e); });
      $('yes').textContent = block.buttons[0]; $('no').textContent = block.buttons[1];
      if (block.adult_checkbox) { $('adultRow').hidden = false; $('adultText').textContent = block.adult_checkbox; }
      $('step1').hidden = true; $('step2').hidden = false; $('out').hidden = true; window.scrollTo(0, 0);
    } catch (e) { say('Sin conexión: intenta de nuevo o ingresa con tu cédula o QR.', true); }
    finally { $('go').disabled = false; }
  });
  async function send(decision) {
    const fd = identity();
    fd.append('channel', channel); fd.append('decision', decision);
    fd.append('text_hash', block.hash); fd.append('adult', $('adult').checked ? 'true' : 'false');
    let f = null;
    if (decision === 'accept' && needSelfie) {
      f = $('selfie').files[0];
      if (!f) return say('Falta tu selfie.', true);
      fd.append('file', f);
    }
    $('yes').disabled = $('no').disabled = $('send').disabled = true;
    try {
      const r = await fetch(`/api/aceptar/${encodeURIComponent(code)}`, { method: 'POST', body: fd });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { $('step2').hidden = true; $('step3').hidden = true; say(j.message || 'Listo.'); $('selfie').value = ''; f = null; fd.delete('file'); }          // la foto no queda colgada en la pestaña
      else { say(j.detail || 'No se pudo completar. Intenta de nuevo o ingresa con tu cédula o QR.', true); $('yes').disabled = $('no').disabled = $('send').disabled = false; }
    } catch (e) { say('Sin conexión: intenta de nuevo o ingresa con tu cédula o QR.', true); $('yes').disabled = $('no').disabled = $('send').disabled = false; }
  }
  // Aceptar primero; la cámara (la selfie) aparece solo después de aceptar.
  $('yes').addEventListener('click', () => {
    if (block.adult_checkbox && !$('adult').checked) return say('Marca la declaración de mayoría de edad para continuar.', true);
    if (needSelfie) { $('step2').hidden = true; $('step3').hidden = false; $('out').hidden = true; window.scrollTo(0, 0); } else send('accept');
  });
  $('send').addEventListener('click', () => send('accept'));
  $('no').addEventListener('click', () => send('reject'));
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <title>Guardar contacto</title>
  {% include "_contact_public_head.html" %}
  <script src="{{ url_for('static', path='js/contact-common.js') }}"></script>
  <script src="{{ url_for('static', path='js/contact-card.js') }}" defer></script>
</head>
<body class="gw-page">
<main class="ct-wrap" data-token="{{ token }}" data-mode="card" data-available="{{ 'true' if available else 'false' }}">
  {% if logo_url %}<div class="ct-logo"><img src="{{ logo_url }}" alt="Logo"></div>{% endif %}
  <div class="gw-card gw-stack" id="cardBox" hidden>
    <p class="ct-muted" id="cardEvent">{{ event_name }}</p>
    <h1 class="ct-name" id="cardName"></h1>
    <p class="ct-muted" id="cardCompany"></p>
    <p class="ct-muted" id="cardTitle"></p>
    <p id="cardPhone"></p><p id="cardEmail"></p>
    <a class="gw-btn gw-btn--primary gw-btn--block" id="saveBtn" href="#" download>Guardar contacto</a>
    <p class="ct-muted">Se descarga una tarjeta de contacto (.vcf): ábrela y pulsa «Guardar» en tu agenda.</p>
  </div>
  <div class="gw-card gw-stack" id="goneBox" hidden>
    <h1 class="ct-name">Contacto no disponible</h1>
    <p class="ct-muted">Este enlace ya no está activo o la persona decidió no compartir sus datos.</p>
  </div>
</main>
</body>
</html>

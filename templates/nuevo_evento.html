<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Evento | Golden Logísticas</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="{{ url_for('static', path='js/clockpicker.js') }}"></script>
    <script src="{{ url_for('static', path='js/toast.js') }}"></script>
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
    <script src="{{ url_for('static', path='js/color-library.js') }}"></script>
    <style>
        .small-btn { font-size:0.78rem; padding:6px 14px; border-radius:20px; border:1px solid #ccc; background:white; cursor:pointer; }
    </style>
</head>
<body class="has-sidebar">
{% include "_sidebar.html" %}
<header class="golden-header">
  <div class="golden-header-container">
    <a href="/" class="golden-logo">
      <img src="https://www.goldenlogisticas.com/wp-content/uploads/2025/07/logo-golden-con-letras-1.png" alt="Golden Logísticas Logo">
    </a>
    <nav style="display:flex; gap:14px; align-items:center;">
      <span style="color:#666; font-size:0.85rem;">{{ staff_name }} ({{ staff_role }})</span>
      <form action="/logout" method="post" style="margin:0;">
        <button type="submit" class="small-btn">Salir</button>
      </form>
    </nav>
  </div>
</header>
<div class="golden-content-spacer"></div>

<main class="golden-main">
  <div class="golden-container" style="padding: 3rem 2rem; max-width: 800px;">
    <div class="golden-section-title" style="text-align:left; margin-bottom:1.5rem;">
      <span>{{ tenant_name }}</span>
      <h2>Nuevo evento</h2>
    </div>

    <div class="golden-badge-builder">
      <form id="newEventForm">
        <div class="badge-input-row">
          <div class="badge-input-group"><label>Código interno *</label><input type="text" name="event_code" required></div>
          <div class="badge-input-group"><label>Nombre del evento *</label><input type="text" name="name" required></div>
        </div>
        <div class="badge-input-row">
          <div class="badge-input-group"><label>Fecha inicio *</label><input type="date" name="start_date" required></div>
          <div class="badge-input-group"><label>Fecha fin *</label><input type="date" name="end_date" required></div>
          <div class="badge-input-group"><label>Fecha montaje *</label><input type="date" name="setup_date" required></div>
        </div>
        <div class="badge-input-row">
          <div class="badge-input-group"><label>Hora inicio evento *</label><input type="text" class="clock-time" name="event_time_start" required></div>
          <div class="badge-input-group"><label>Hora fin evento *</label><input type="text" class="clock-time" name="event_time_end" required></div>
        </div>
        <div class="badge-input-row">
          <div class="badge-input-group"><label>Hora inicio montaje *</label><input type="text" class="clock-time" name="setup_time_start" required></div>
          <div class="badge-input-group"><label>Hora fin montaje *</label><input type="text" class="clock-time" name="setup_time_end" required></div>
        </div>
        <div class="badge-input-row">
          <div class="badge-input-group"><label>País *</label><input type="text" id="countryField" name="country" list="countryList" required autocomplete="off" value="Colombia"></div>
          <div class="badge-input-group"><label>Ciudad *</label><input type="text" id="cityField" name="city" list="cityList" required autocomplete="off" value="Bogotá"></div>
        </div>
        <datalist id="cityList"></datalist>
        <div class="badge-input-row">
          <div class="badge-input-group"><label>Lugar *</label><input type="text" name="location" required></div>
          <div class="badge-input-group"><label>Dirección *</label><input type="text" name="address" required></div>
        </div>
        <div class="badge-input-row">
          <div class="badge-input-group" style="min-width:100%;">
            <label>Coordinador asignado *</label>
            <input type="text" name="coordinator_label" list="coordinatorList" required autocomplete="off" placeholder="Escribe para buscar...">
          </div>
        </div>
        <div class="badge-input-row">
          <div class="badge-input-group" style="min-width:100%;">
            <label>Comercial asignada *</label>
            <input type="text" name="commercial_label" list="commercialList" required autocomplete="off" placeholder="Escribe para buscar...">
          </div>
        </div>
        <div class="badge-input-row">
          <div class="badge-input-group" style="min-width:100%;">
            <label>Superevento (opcional — agrupa eventos hermanos de este cliente)</label>
            <div style="display:flex; gap:8px;">
              <select name="super_event_id" id="superEventSelect" style="flex:1; padding:0.7rem; border:1px solid #ddd; border-radius:10px;"><option value="">— Ninguno —</option></select>
              <button type="button" id="newSuperBtn" class="small-btn" style="padding:8px 16px; white-space:nowrap;">+ Nuevo superevento</button>
            </div>
          </div>
        </div>
        <div class="badge-input-row">
          <div class="badge-input-group" style="max-width:110px;">
            <label>Color de pañoleta</label>
            <input type="color" name="bandana_color" value="#D4AF37" style="width:100%; height:44px; padding:2px; border:1px solid #ddd; border-radius:8px; cursor:pointer;">
          </div>
          <div class="badge-input-group"><label>Nombre del color</label><input type="text" name="bandana_color_name" placeholder="Ej. Rojo Golden"></div>
        </div>
        <div class="badge-input-row">
          <div class="badge-input-group" style="min-width:100%;"><label>Observaciones</label><input type="text" name="notes"></div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:1rem;">
          <a href="/clientes" class="small-btn" style="padding:10px 20px;">Cancelar</a>
          <button type="submit" class="golden-btn golden-btn-primary" style="width:auto; padding:0.7rem 2rem;">Crear evento</button>
        </div>
      </form>
    </div>
  </div>
</main>

<datalist id="countryList"></datalist>
<datalist id="coordinatorList"></datalist>
<datalist id="commercialList"></datalist>

<script>
const TENANT_ID = "{{ tenant_id }}";
const STAFF_ROLE = "{{ staff_role }}";
const STAFF_ID = {{ staff_id if staff_id is not none else 'null' }};
const COUNTRIES = ["Colombia","México","Argentina","Chile","Perú","Ecuador","Venezuela","Bolivia","Paraguay","Uruguay","Brasil","Panamá","Costa Rica","Guatemala","Honduras","El Salvador","Nicaragua","República Dominicana","Cuba","Puerto Rico","España","Estados Unidos","Canadá","Francia","Alemania","Italia","Reino Unido","Portugal","Países Bajos","Bélgica","Suiza","China","Japón","Corea del Sur","India","Australia"];
document.getElementById("countryList").innerHTML = COUNTRIES.map(c => `<option value="${c}">`).join("");

document.querySelectorAll(".clock-time").forEach((input) => attachClockPicker(input));
ColorLibrary.attach(document.querySelector('[name="bandana_color"]'), document.querySelector('[name="bandana_color_name"]'));

async function loadCitiesFor(country) {
  const cityDatalist = document.getElementById("cityList");
  if (!country) { cityDatalist.innerHTML = ""; return; }
  const res = await fetch(`/api/cities?country=${encodeURIComponent(country)}`);
  const cities = res.ok ? await res.json() : [];
  cityDatalist.innerHTML = cities.map(c => `<option value="${c}">`).join("");
}
document.getElementById("countryField").addEventListener("change", (e) => loadCitiesFor(e.target.value.trim()));
// País/Ciudad por defecto (2026-09-17, pedido explícito): Colombia/Bogotá, editable como
// cualquier otro campo — solo precarga el datalist de ciudades para que el valor por defecto
// tenga sus sugerencias listas igual que si el usuario acabara de elegir el país a mano.
loadCitiesFor(document.getElementById("countryField").value.trim());

let coordinatorsByLabel = {};
async function loadCoordinatorOptions() {
  const res = await fetch("/api/staff/coordinators");
  const coords = await res.json();
  coordinatorsByLabel = {};
  document.getElementById("coordinatorList").innerHTML = coords.map(c => {
    const label = `${c.full_name || c.username} (${c.username})`;
    coordinatorsByLabel[label] = c.id;
    return `<option value="${label}">`;
  }).join("");
}
loadCoordinatorOptions();

// Sprint 2.4 Fase 5 (2026-09-16, pedido explícito): "por defecto aparece quien está creando el
// evento, si es una comercial... y lo puede cambiar a otras comerciales que haya" — si quien crea
// es comercial, se preselecciona a sí misma (pero sigue siendo editable); admin+ tiene que elegir.
let commercialsByLabel = {};
async function loadCommercialOptions() {
  const res = await fetch("/api/staff/commercials");
  const commercials = await res.json();
  commercialsByLabel = {};
  document.getElementById("commercialList").innerHTML = commercials.map(c => {
    const label = `${c.full_name || c.username} (${c.username})`;
    commercialsByLabel[label] = c.id;
    return `<option value="${label}">`;
  }).join("");
  if (STAFF_ROLE === "comercial") {
    const self = commercials.find(c => c.id === STAFF_ID);
    if (self) {
      const field = document.querySelector('input[name="commercial_label"]');
      field.value = `${self.full_name || self.username} (${self.username})`;
    }
  }
}
loadCommercialOptions();

async function loadSuperEvents(selectedId) {
  const res = await fetch(`/api/super-events?tenant_id=${encodeURIComponent(TENANT_ID)}`);
  const list = res.ok ? await res.json() : [];
  const select = document.getElementById("superEventSelect");
  select.innerHTML = '<option value="">— Ninguno —</option>' + list.map(s => `<option value="${s.id}">${s.name} (${s.events} eventos)</option>`).join("");
  select.value = selectedId ? String(selectedId) : "";
}
loadSuperEvents();
document.getElementById("newSuperBtn").addEventListener("click", async () => {
  const name = await showPrompt("Nombre del superevento (ej. Congreso X):", { confirmLabel: "Crear" });
  if (!name) return;
  const res = await fetch("/api/super-events", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ tenant_id: TENANT_ID, name }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { showToast(data.detail || "No se pudo crear el superevento", "error"); return; }
  await loadSuperEvents(data.id);
  showToast("Superevento creado y seleccionado", "success");
});

document.getElementById("newEventForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const form = ev.target;
  const formData = new FormData(form);
  const payload = Object.fromEntries(formData.entries());
  payload.tenant_id = TENANT_ID;
  payload.super_event_id = payload.super_event_id ? parseInt(payload.super_event_id, 10) : null;

  const coordinatorId = coordinatorsByLabel[payload.coordinator_label];
  if (!coordinatorId) {
    showToast("Selecciona un coordinador válido de la lista.", "error");
    return;
  }
  payload.coordinator_staff_id = coordinatorId;
  delete payload.coordinator_label;

  const commercialId = commercialsByLabel[payload.commercial_label];
  if (!commercialId) {
    showToast("Selecciona una comercial válida de la lista.", "error");
    return;
  }
  payload.commercial_staff_id = commercialId;
  delete payload.commercial_label;

  const btn = form.querySelector('button[type="submit"]');
  setButtonLoading(btn, true, "Creando...");
  const res = await fetch("/api/events", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload),
  });
  if (res.ok) {
    showToast("Evento creado", "success");
    window.location.href = "/clientes";
  } else {
    const err = await res.json();
    showToast(err.detail || "No se pudo crear el evento", "error");
    setButtonLoading(btn, false);
  }
});
</script>
</body>
</html>

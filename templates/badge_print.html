<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir escarapela</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/fonts-propias.css') }}">
    <script src="{{ url_for('static', path='vendor/qrcode-generator-1.4.4.min.js') }}"></script>
    <script src="{{ url_for('static', path='vendor/JsBarcode-3.12.3.all.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/badge-render.js') }}"></script>
    {# 27-oct-2026: la ventana de impresión usa la MISMA etiqueta compuesta que el USB (recorte, giro y margen resueltos de Parámetros y de ⚙️): static/js/label-compose.js #}
    <meta name="gw-print-settings" content="{{ print_settings_json(event) }}">
    <script src="{{ url_for('static', path='vendor/html2canvas-1.4.1.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/ql-usb.js') }}"></script>
    <script src="{{ url_for('static', path='js/label-compose.js') }}"></script>
    <style>
        html, body { margin:0; padding:0; background:#ddd; }
        .print-toolbar {
            display:flex; gap:10px; align-items:center; justify-content:center; padding:14px;
            background:#0A0E2E; color:white; font-family: sans-serif; font-size:0.85rem;
        }
        .print-toolbar button {
            border:none; border-radius:20px; padding:8px 18px; font-weight:700; cursor:pointer; font-size:0.85rem;
        }
        .btn-print { background:#D4AF37; color:#1a1200; }
        .btn-close { background:#444; color:white; }
        #badgeWrapper { display:flex; align-items:center; justify-content:center; padding:2rem 0; }
        #badgePrint { background:white; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
        #printStatus { text-align:center; color:#666; font-family:sans-serif; font-size:0.85rem; }

        @media print {
            .print-toolbar, #printStatus { display:none !important; }
            html, body { background:white; }
            #badgeWrapper { padding:0; }
            #badgePrint { box-shadow:none; }
        }
    </style>
</head>
<body>
<div class="print-toolbar">
    <span>Escarapela — {{ event.name }}</span>
    <button type="button" class="btn-print" id="printBtn">🖨️ Imprimir</button>
    <button type="button" class="btn-close" onclick="window.close()">Cerrar</button>
</div>
<p id="printStatus">Cargando…</p>
<div id="badgeWrapper">
    <div id="badgePrint"></div>
</div>

<script>
(function () {
    const EVENT_ID = {{ event.id }};
    const USER_ID = {{ print_user_id_json | safe }};
    window.EVENT_ID = EVENT_ID;

    const statusEl = document.getElementById('printStatus');
    const badgeEl = document.getElementById('badgePrint');
    const pageStyle = document.createElement('style');
    document.head.appendChild(pageStyle);

    // Bug real (2026-09-17, pedido explícito): una escarapela con imagen (logo, image_static) se
    // veía bien en pantalla pero la imagen no aparecía en la vista previa de impresión del
    // navegador. Esperar solo el evento 'load' no alcanza — Chrome puede disparar 'load' antes de
    // terminar de DECODIFICAR la imagen, y si window.print() se llama en ese punto, el motor de
    // impresión a veces captura la página con la imagen todavía en blanco. img.decode() resuelve
    // recién cuando la imagen está lista para pintarse — es el fix estándar para este problema.
    function waitForImages(container, timeoutMs) {
        const imgs = Array.from(container.querySelectorAll('img'));
        if (!imgs.length) return Promise.resolve();
        const promises = imgs.map(img => new Promise(resolve => {
            const decodeAndResolve = () => {
                if (img.decode) img.decode().then(resolve).catch(resolve);
                else resolve();
            };
            if (img.complete) { decodeAndResolve(); return; }
            img.addEventListener('load', decodeAndResolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
        }));
        const timeout = new Promise(resolve => setTimeout(resolve, timeoutMs));
        return Promise.race([Promise.all(promises), timeout]);
    }

    function printSettings() {
        try { const m = document.querySelector('meta[name="gw-print-settings"]'); const v = m ? JSON.parse(m.getAttribute('content') || '{}') : {}; return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; }
    }
    // Devuelve true si la etiqueta compuesta quedó lista para imprimir; false si no hay con qué componerla (módulos sin cargar); lanza si la composición falla.
    async function printComposed(template, data) {
        if (!(window.LabelCompose && window.QLUsb && window.html2canvas)) return false;
        let storage = null; try { storage = window.localStorage; } catch (e) { storage = null; }
        const p = QLUsb.resolvePrefs(storage, printSettings()).prefs;
        const stage = document.createElement('div');
        stage.setAttribute('aria-hidden', 'true'); stage.style.cssText = 'position:fixed; left:-10000px; top:0; background:#fff;';
        document.body.appendChild(stage);
        let out;
        try {
            const shot = await LabelCompose.renderShot(stage, template, data, EVENT_ID);
            out = LabelCompose.composeBitmap(shot, template.width_mm, template.height_mm, p);
        } finally { stage.remove(); }
        const spec = LabelCompose.pageSpec(out);
        // 28-oct-2026 (probado en una Brother QL-800 con Windows): Chrome solo respeta «margin: 0» (y quita fecha, ruta y «1/1») si el ancho de la página es el del papel del controlador, 62 mm;
        // con 58,93 mm los ignora. Por eso la página mide 62 mm de ancho y la etiqueta de 58,93 mm va a PAGE_LEFT_MM del borde izquierdo (el área imprimible empieza en el borde izquierdo y mide ~60 mm).
        const PAGE_W = 62, PAGE_LEFT_MM = 0.5, PAGE_MIN_H = 99.8;       // probado en la Brother: 62×99,8 / 95 / 110 mm salen limpias y sin girar; 40, 45, 65 mm traen fecha, ruta y «1/1», y 60,6 mm el controlador la gira (papel de 79 mm). Por eso nunca se pide una página más corta que el papel de 99,8 mm
        const pageH = Math.max(spec.pageHeightMm, PAGE_MIN_H);
        spec.pageCss = `@page { size: ${PAGE_W}mm ${pageH}mm; margin: 0 }`;
        const img = document.createElement('img');
        img.id = 'labelImg'; img.alt = '';
        img.src = LabelCompose.bitmapToDataUrl(out.bitmap, out.tapeDots, out.height, p.mirror);
        img.style.cssText = `display:block; margin-left:${PAGE_LEFT_MM}mm; width:${spec.imageWidthMm}mm; height:${spec.imageHeightMm}mm; image-rendering:pixelated; background:#fff;`;
        badgeEl.style.display = 'none';
        document.getElementById('badgeWrapper').appendChild(img);
        pageStyle.innerHTML = `${spec.pageCss} @media print { html, body { margin:0; padding:0; background:#fff; } #badgeWrapper { display:block; padding:0; margin:0; width:${PAGE_W}mm; height:calc(${pageH}mm - 0.2mm); overflow:hidden; } ` +
            `#badgePrint { display:none !important; } #labelImg { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }`;
        statusEl.style.display = 'none';
        if (img.decode) await img.decode().catch(() => {});
        return true;
    }

    async function load() {
        try {
            // Primero los datos de la persona: dicen qué plantilla le toca (por categoría, ítem 14).
            const dataRes = await fetch(`/api/users/${encodeURIComponent(USER_ID)}/badge-print-data?event_id=${EVENT_ID}`);
            const data = dataRes.ok ? await dataRes.json() : null;
            const tplRes = data ? await BadgeRender.fetchTemplate(EVENT_ID, data.template_category) : null;          // la plantilla vigente (sin copias guardadas)
            if (!dataRes.ok || !tplRes.ok) {
                statusEl.innerText = 'No se pudo cargar la escarapela (revisa que la persona exista en este evento).';
                return;
            }
            const template = await tplRes.json();

            // @page con el tamaño REAL de la plantilla — así la impresora (ej. Brother QL-800)
            // recibe el tamaño de etiqueta correcto en vez del tamaño carta por defecto del navegador.
            // 26-oct-2026 (último recurso: el camino normal es la barra de impresión de Registro, que arma una imagen de 58,9 mm): una etiqueta APAISADA (más ancha que alta) se gira 90° y la página
            // se declara girada (alto × ancho), igual que el giro automático del USB; así el lado largo va a lo largo de la cinta y nada sale cortado por ningún borde.
            const rotate = template.width_mm > template.height_mm;
            const pw = rotate ? template.height_mm : template.width_mm, ph = rotate ? template.width_mm : template.height_mm;
            pageStyle.innerHTML = `@page { size: ${pw}mm ${ph}mm; margin: 0; } @media print { #badgeWrapper { display:block; position:relative; width:${pw}mm; height:${ph}mm; overflow:hidden; padding:0; } ` +
                (rotate ? `#badgePrint { position:absolute; left:${pw}mm; top:0; transform-origin:0 0; transform:rotate(90deg); }` : '#badgePrint { position:absolute; left:0; top:0; }') + ' }';

            // 27-oct-2026: se imprime la MISMA etiqueta que sale por USB (composición de static/js/label-compose.js con el recorte, el giro y el margen resueltos de Parámetros y de ⚙️), mostrada
            // como una imagen de tamaño exacto (puntos × 25,4 / 300 mm), con @page de ese tamaño, margin:0, sin escalado, centrada a lo ancho. El cuadro de Chrome sigue apareciendo. Si la composición
            // falla, cae a la hoja de la plantilla de siempre (arriba) y avisa.
            let composedOk = false, warn = '';
            try { composedOk = await printComposed(template, data); } catch (e) { composedOk = false; warn = 'No se pudo armar la etiqueta con el recorte y el margen de Parámetros: se imprime la hoja de la plantilla.'; }
            if (!composedOk) {
                await BadgeRender.loadFonts(template);            // la tipografía elegida ya cargada antes de dibujar e imprimir
                BadgeRender.renderBadge(badgeEl, template, data, { eventId: EVENT_ID });
                if (warn) { statusEl.innerText = '⚠️ ' + warn; } else statusEl.style.display = 'none';
                await waitForImages(badgeEl, 4000);
            }
            window.print();
        } catch (e) {
            statusEl.innerText = 'Error de red cargando la escarapela.';
        }
    }

    document.getElementById('printBtn').addEventListener('click', () => window.print());
    load();
})();
</script>
</body>
</html>

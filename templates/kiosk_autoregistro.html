<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Autorregistro | GoldenWeb 2.0</title>
    {% include "_gw_head.html" %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/gw-autoregistro.css') }}">
</head>
<body class="gw-page gw-autoreg">
<main class="gw-autoreg__box" data-selfreg-event="{{ event.id }}">
    <h1 class="gw-autoreg__title">{{ event.name }}</h1>
    <p class="gw-autoreg__sub">Regístrate tú mismo: escribe tus datos y listo.</p>
    <p id="notice" class="gw-autoreg__msg gw-autoreg__msg--warn" role="status" aria-live="polite" hidden></p>
    <form id="form" class="gw-autoreg__form" novalidate autocomplete="off" hidden>
        <div id="fields" class="gw-autoreg__fields"></div>
        <button type="submit" id="send" class="gw-btn gw-btn--primary gw-autoreg__send">Registrarme</button>
    </form>
    <section id="done" class="gw-autoreg__done" hidden aria-live="polite">
        <p id="doneText" class="gw-autoreg__msg gw-autoreg__msg--ok"></p>
    </section>
    <p class="gw-autoreg__legal">Tus datos se usan solo para tu acreditación en este evento. <a href="/privacidad" target="_blank" rel="noopener">Política de Privacidad</a>.</p>
</main>
<script src="{{ url_for('static', path='js/selfreg-boot.js') }}"></script>
<script src="{{ url_for('static', path='js/toast.js') }}"></script>
<script src="{{ url_for('static', path='js/selfreg.js') }}"></script>
</body>
</html>

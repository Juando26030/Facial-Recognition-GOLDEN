{# Pantalla de TV de turnos (Fase 8): se abre en pantalla completa en el televisor, con la sesión del personal. Solo tokens --gw-*. #}
<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Turnos | {{ event.name }}</title>
    {% include "_gw_head.html" %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/gw-turnos.css') }}">
    <script>window.EVENT_ID = {{ event.id }};</script>
    <script src="{{ url_for('static', path='js/queue-tv.js') }}" defer></script>
</head>
<body class="gw-page">
<main class="tq-tv">
  <h1 class="tq-tv__title">{{ event.name }}</h1>
  <section id="tvLanes" class="tq-tv__lanes" aria-live="polite"></section>
  <section id="tvRecent" class="tq-tv__recent" aria-label="Últimos llamados"></section>
  <button type="button" id="tvSound" class="gw-btn gw-btn--secondary gw-btn--sm tq-tv__sound">Activar sonido</button>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Entrar con mi rostro | GoldenWeb 2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/design-system.css') }}">
    <style>
        /* Fondo BLANCO con detalles azules y dorados de la marca, legible a distancia */
        body { margin: 0; background: #fff; color: var(--golden-dark, #0a0e2e); font-family: var(--font-body, sans-serif); border-top: 10px solid var(--golden-primary, #D4AF37); }
        .door h1 { color: var(--golden-dark, #0a0e2e); }
        .door { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; box-sizing: border-box; text-align: center; }
        .door h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.2rem); }
        .btn-face { background: var(--golden-primary, #D4AF37); color: #1a1200; border: none; border-radius: 999px; font-size: clamp(1.3rem, 4vw, 2rem); font-weight: 800; padding: 22px 48px; cursor: pointer; }
        .btn-doc { background: transparent; color: var(--golden-dark, #0a0e2e); border: 2px solid var(--golden-dark, #0a0e2e); border-radius: 999px; padding: 12px 28px; font-size: 1.15rem; font-weight: 700; cursor: pointer; }
        .btn-face { box-shadow: 0 6px 18px rgba(212, 175, 55, .45); }
        .cam { position: relative; width: min(92vw, 520px); aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: #000; }
        .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .oval { position: absolute; left: 50%; top: 46%; width: 62%; height: 70%; transform: translate(-50%, -50%); border: 4px dashed rgba(255,255,255,.85); border-radius: 50%; box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; }
        .count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 5rem; font-weight: 800; color: #fff; text-shadow: 0 2px 12px #000; }
        .cam { border: 4px solid var(--golden-dark, #0a0e2e); }
        .msg { font-size: clamp(1.1rem, 3vw, 1.5rem); max-width: 640px; }
        .msg.ok { color: #1e7a3a; font-weight: 700; }
        .counter { position: fixed; bottom: 10px; right: 14px; font-size: .8rem; opacity: .6; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<main class="door">
    <h1>{{ event.name }}</h1>
    <section id="start">
        <p><button type="button" class="btn-face" id="faceBtn">Entrar con mi rostro</button></p>
        <p><button type="button" class="btn-doc" id="docBtn">Ingresar con cédula o QR</button></p>
    </section>
    <section id="camera" hidden>
        <p class="msg">Mira de frente a la cámara, dentro del óvalo.</p>
        <div class="cam"><video id="video" autoplay playsinline muted></video><div class="oval"></div><div class="count" id="count"></div></div>
    </section>
    <p id="out" class="msg" role="status" aria-live="polite" hidden></p>
</main>
<div class="counter" id="counter" aria-hidden="true"></div>
<script>
(function () {
    const EVENT_ID = {{ event.id }};
    const CONTINGENCY = {{ 'true' if contingency_enabled else 'false' }};      // modo contingencia del servidor (copia local de la lista + service worker)
    const $ = (id) => document.getElementById(id);
    let stream = null, busy = false, misses = 0, turnTimer = null;
    const NOT_FOUND = {{ not_found|tojson }};
    // Límite POR PERSONA (turno): 2 intentos seguidos sin coincidencia → «No te encontramos…» y la pantalla se reinicia sola para la siguiente persona (nunca bloquea el equipo).
    const MAX_MISSES = 2;
    const say = (text, ok) => { const o = $('out'); o.hidden = false; o.textContent = text; o.className = 'msg' + (ok ? ' ok' : ''); };
    // Sin conexión (o con el modo contingencia del quiosco activo) el botón de rostro NO aparece; «Ingresar con cédula o QR» queda siempre.
    // `navigator.onLine` no basta (con el wifi apagado muchos equipos siguen diciendo «en línea»): se consulta /health cada 4 s con 2,5 s de espera, y cualquier fallo de red
    // de una petición también cuenta como «sin conexión». El botón vuelve solo cuando el servidor responde de nuevo.
    let serverUp = navigator.onLine;       // si la página abrió desde la copia guardada, sin red, nace «sin conexión»
    const canFace = () => serverUp && navigator.onLine && !document.body.classList.contains('golden-contingency');
    const refreshButton = () => { $('faceBtn').hidden = !canFace(); };
    const setUp = (up) => { if (serverUp !== up) { serverUp = up; refreshButton(); if (typeof syncDocButton === 'function') { syncDocButton(); offlineNotice(); } } };
    async function ping() {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
        try { const r = await fetch('/health?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal }); setUp(r.ok); }
        catch (e) { setUp(false); }
        finally { clearTimeout(t); }
    }
    window.addEventListener('online', () => { refreshButton(); ping(); });
    window.addEventListener('offline', () => setUp(false));
    setInterval(ping, 4000); ping();
    refreshButton();
    const stop = () => { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } $('video').srcObject = null; };
    const reset = (ms) => setTimeout(() => { $('out').hidden = true; $('camera').hidden = true; $('start').hidden = false; busy = false; refreshButton(); }, ms);
    const endTurn = () => { misses = 0; clearTimeout(turnTimer); };
    const REGISTRO = `/kiosk/${EVENT_ID}/registro`;
    // «Ingresar con cédula o QR»: con conexión, la persona se dirige al personal; SIN conexión lleva a Registro, que (con el modo contingencia) abre desde su copia guardada y acredita por
    // cédula o QR con la lista local, sin red.
    const syncDocButton = () => { $('docBtn').textContent = serverUp ? 'Ingresar con cédula o QR' : 'Ingresar con cédula o QR (sin conexión)'; };
    $('docBtn').addEventListener('click', () => {
        if (!serverUp) { location.href = REGISTRO; return; }
        say('Acércate al personal de acreditación con tu cédula o el QR de tu escarapela.'); reset(5000);
    });
    syncDocButton();
    // Sin conexión y con el modo contingencia: el propio equipo ofrece la entrada por cédula/QR de inmediato (sin pantalla en blanco ni esperar al personal).
    const offlineNotice = () => { if (!serverUp && CONTINGENCY) say('Sin conexión. Ingresa con tu cédula o QR en el modo sin conexión.'); else if (serverUp && !busy) $('out').hidden = true; };
    function frame() {                     // un fotograma a 640 px de lado mayor, en JPEG: solo vive en memoria hasta enviarlo
        const v = $('video'), scale = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
        const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        return new Promise((resolve) => c.toBlob(resolve, 'image/jpeg', 0.9));
    }
    $('faceBtn').addEventListener('click', async () => {
        if (busy || !canFace()) return;
        busy = true; $('out').hidden = true;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false });
        } catch (e) { say('No se pudo abrir la cámara. Ingresa con tu cédula o QR en la acreditación.'); busy = false; return; }
        $('start').hidden = true; $('camera').hidden = false; $('video').srcObject = stream;
        for (const n of [3, 2, 1]) { $('count').textContent = n; await new Promise((r) => setTimeout(r, 900)); }
        $('count').textContent = '';
        const blob = await frame();
        stop(); $('camera').hidden = true;
        say('Un momento…');
        const fd = new FormData(); fd.append('event_id', EVENT_ID); fd.append('file', blob, 'rostro.jpg');
        try {
            const r = await fetch('/api/door-face', { method: 'POST', body: fd });
            const j = await r.json().catch(() => ({}));
            lastAct = Date.now(); counter();            // hubo un intento en esta pantalla: actualiza el contador ya (y mantiene el refresco 5 min)
            if (r.ok && (j.result === 'OK' || j.result === 'ALREADY')) {
                endTurn(); say(j.message, true); reset(4500);
                if (j.print_user_id) {                    // autoimpresión del evento: igual que con cédula (la foto biométrica sale en blanco mientras su interruptor esté apagado)
                    fetch(`/api/users/${encodeURIComponent(j.print_user_id)}/print-log?event_id=${EVENT_ID}`, { method: 'POST' }).catch(() => {});
                    try { if (window.__gwPrintWin && !window.__gwPrintWin.closed) window.__gwPrintWin.close(); } catch (e) { /* otra referencia */ }       // ventana con nombre fijo: no se acumulan
                    window.__gwPrintWin = window.open(`/kiosk/${EVENT_ID}/escarapela/imprimir/${encodeURIComponent(j.print_user_id)}`, 'goldenweb_print', 'width=480,height=720');
                }
                return;
            }
            if (r.ok) {                                   // sin coincidencia o sin rostro: cuenta para el turno de ESTA persona
                misses++;
                clearTimeout(turnTimer); turnTimer = setTimeout(endTurn, 30000);          // si nadie vuelve a intentar en 30 s, es otra persona
                if (misses >= MAX_MISSES) { endTurn(); say(NOT_FOUND); reset(6000); return; }
                say(j.result === 'NO_MATCH' ? 'No te reconocimos. Intenta una vez más, mirando de frente.' : j.message);
                reset(2500); return;
            }
            say(j.detail || 'Intenta de nuevo o ingresa con tu cédula o QR.');
        } catch (e) { setUp(false); say('Sin conexión: ingresa con tu cédula o QR en la acreditación.'); }
        endTurn(); reset(4500);
    });
    let lastAct = 0;                       // último intento de reconocimiento en esta pantalla; sin actividad en 5 min el contador no consulta la base (Neon se duerme)
    async function counter() {             // contador solo numérico, para el personal
        try { const r = await fetch(`/api/events/${EVENT_ID}/door-face/stats`, { cache: 'no-store' }); if (r.ok) { const d = await r.json(); $('counter').textContent = `Intentos ${d.attempts} · Coincidencias ${d.matches} · Sin coincidencia ${d.no_match}`; } } catch (e) { /* sin red */ }
    }
    // Service worker del quiosco (solo con el modo contingencia): guarda esta pantalla y la de Registro con sus archivos para que, si se recarga sin red, abra y lleve a la entrada
    // por cédula/QR sin conexión. Nunca guarda la API ni la lista (eso lo hace contingency.js al abrir Registro con conexión).
    if (CONTINGENCY && 'serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/kiosk/sw.js').then(() => navigator.serviceWorker.ready).then(async (reg) => {
        const own = [location.origin + location.pathname, ...performance.getEntriesByType('resource').map((e) => e.name).filter((n) => n.startsWith(location.origin + '/static/'))];
        let extra = [location.origin + REGISTRO];
        try {                                   // los archivos que usa Registro (la página que atiende la entrada sin red): se leen de su HTML
            const html = await (await fetch(REGISTRO, { credentials: 'same-origin' })).text();
            extra = extra.concat([...html.matchAll(/(?:src|href)="(\/static\/[^"]+)"/g)].map((m) => location.origin + m[1]));
        } catch (e) { /* sin red ahora: queda lo que ya estaba guardado */ }
        const urls = [...new Set(own.concat(extra))];
        const send = () => { const sw = navigator.serviceWorker.controller || reg.active; if (sw) sw.postMessage({ type: 'precache', urls }); };
        send();
        navigator.serviceWorker.addEventListener('controllerchange', send);
    }).catch(() => {}));
    counter(); setInterval(() => { if (!document.hidden && lastAct && Date.now() - lastAct < 300000) counter(); }, 30000);
})();
</script>
</body>
</html>

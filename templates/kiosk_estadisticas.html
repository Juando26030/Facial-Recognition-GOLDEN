<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas | Golden Logísticas</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="{{ url_for('static', path='js/toast.js') }}"></script>
</head>
<body>

<header class="golden-header">
  <div class="golden-header-container">
    <a href="#" class="golden-logo">
      <img src="https://www.goldenlogisticas.com/wp-content/uploads/2025/07/logo-golden-con-letras-1.png" alt="Golden Logísticas Logo">
    </a>
    <nav class="golden-nav" style="display:flex; align-items:center; gap:12px;">
      <div class="golden-anniversary-badge">{{ event.name }}</div>
      <a href="/kiosk/{{ event.id }}" style="font-weight:600; color: var(--golden-dark); text-decoration:none;">← Métodos</a>
      <a href="/" style="font-weight:600; color: var(--golden-dark); text-decoration:none;">← Panel</a>
      <span style="color:#666; font-size:0.85rem;">{{ staff_name }} ({{ staff_role }})</span>
      <form action="/logout" method="post" style="margin:0;">
        <button type="submit" style="background:none; border:1px solid #ccc; border-radius:20px; padding:6px 14px; cursor:pointer; font-size:0.8rem;">Salir</button>
      </form>
    </nav>
  </div>
</header>
<div class="golden-content-spacer"></div>
<script>window.EVENT_ID = {{ event.id }};</script>

<main class="golden-main">
  <section class="golden-section" style="background: linear-gradient(180deg, rgba(10, 14, 46, 0.02) 0%, rgba(10, 14, 46, 0.05) 100%);">
    <div class="golden-container">
      <div class="golden-section-title">
        <span>GOLDEN EVENTOS Y LOGÍSTICA S.A.S.</span>
        <h2>Estad<span class="gradient-text">ísticas</span></h2>
      </div>

      <div class="app-container">
        <div style="background: white; padding: 3rem; border-radius: 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.08);">
            <h3 style="color: var(--golden-dark); font-size: 1.5rem; margin-bottom: 15px;">Base de Datos Oficial</h3>
            <p style="color: #666; margin-bottom: 30px;">Genera y descarga el reporte unificado en Excel con los campos corporativos estándar.</p>
            <button id="exportBtn" class="golden-btn golden-btn-primary" style="background: #28a745; color: white; width: auto; padding: 1rem 3rem; margin: 0 auto;">
                📥 Exportar Base de Datos (Excel)
            </button>
        </div>
        <p style="text-align:center; color:#999; font-size:0.85rem; margin-top:1.5rem;">El módulo de gráficos por variable llega en la siguiente entrega.</p>
      </div>
    </div>
  </section>
</main>

<script>
(function() {
    document.getElementById('exportBtn').addEventListener('click', () => {
        window.location.href = `/api/report?event_id=${window.EVENT_ID}`;
    });
})();
</script>
</body>
</html>

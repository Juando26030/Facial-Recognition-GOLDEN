<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel | Golden Logísticas</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="{{ url_for('static', path='js/clockpicker.js') }}"></script>
    <script src="{{ url_for('static', path='js/toast.js') }}"></script>
    <style>
        .tenant-card { background: white; border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,0.06); margin-bottom: 1.2rem; overflow: hidden; border: 1px solid #eee; }
        .tenant-head { display:flex; justify-content:space-between; align-items:center; padding: 1.2rem 1.5rem; cursor:pointer; }
        .tenant-head h3 { font-family: var(--font-heading-secondary); color: var(--golden-dark); }
        .tenant-head .meta { font-size: 0.8rem; color: #888; }
        .tenant-body { display:none; padding: 0 1.5rem 1.5rem; border-top: 1px solid #f0f0f0; }
        .tenant-body.open { display:block; }
        .event-row { display:flex; justify-content:space-between; align-items:center; padding: 0.8rem 0; border-bottom: 1px solid #f4f4f4; flex-wrap: wrap; gap: 8px; }
        .event-row:last-child { border-bottom:none; }
        .event-name { font-weight:700; color: var(--golden-dark); }
        .event-meta { font-size: 0.78rem; color:#888; }
        .status-pill { font-size:0.7rem; font-weight:700; padding: 3px 10px; border-radius: 12px; text-transform:uppercase; }
        .status-creado { background: rgba(0,123,255,0.12); color:#0056b3; }
        .status-en_proceso { background: rgba(40,167,69,0.15); color:#1e7e34; }
        .status-finalizado { background: #eee; color:#777; }
        .inline-form { background:#fafafa; border-radius:12px; padding:1rem; margin-top:1rem; display:none; }
        .inline-form.open { display:block; }
        .small-btn { font-size:0.78rem; padding:6px 14px; border-radius:20px; border:1px solid #ccc; background:white; cursor:pointer; }
        .small-btn.primary { background: var(--golden-primary); border-color: var(--golden-primary); color: var(--golden-dark); font-weight:700; }
        .small-btn.danger { background:#dc3545; border-color:#dc3545; color:white; }
        .search-box { width:100%; padding:1rem 1.2rem; border-radius:30px; border:1px solid #ddd; font-size:0.95rem; margin-bottom:1.5rem; }
        .search-box:focus { outline:none; border-color: var(--golden-primary); }
    </style>
</head>
<body>
<header class="golden-header">
  <div class="golden-header-container">
    <a href="/" class="golden-logo">
      <img src="https://www.goldenlogisticas.com/wp-content/uploads/2025/07/logo-golden-con-letras-1.png" alt="Golden Logísticas Logo">
    </a>
    <nav style="display:flex; gap:14px; align-items:center;">
      {% if staff_role in ["admin", "super_admin"] %}<a href="/admin/staff" style="font-weight:600; color: var(--golden-dark); text-decoration:none;">Staff</a>{% endif %}
      <span style="color:#666; font-size:0.85rem;">{{ staff_name }} ({{ staff_role }})</span>
      <form action="/logout" method="post" style="margin:0;">
        <button type="submit" class="small-btn">Salir</button>
      </form>
    </nav>
  </div>
</header>
<div class="golden-content-spacer"></div>

<main class="golden-main">
  <div class="golden-container" style="padding: 3rem 2rem; max-width: 1000px;">

    {% if staff_role in ["digitador", "cliente"] %}
    <div class="golden-section-title" style="text-align:left; margin-bottom:2rem;">
      <span>TUS EVENTOS</span>
      <h2>Eventos autorizados</h2>
    </div>
    <div id="myEventsList"></div>
    {% else %}
    <div class="golden-section-title" style="text-align:left; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:flex-end;">
      <div>
        <span>PANEL</span>
        <h2>Clientes y eventos</h2>
      </div>
      <button class="small-btn primary" onclick="document.getElementById('newTenantForm').classList.toggle('open')">+ Nuevo cliente</button>
    </div>

    <input type="text" id="searchBox" class="search-box" placeholder="Buscar por código, nombre de evento, país, ciudad o cliente...">

    <form id="newTenantForm" class="inline-form">
      <div class="badge-input-row">
        <div class="badge-input-group"><label>Nombre del cliente</label><input type="text" name="name" required></div>
      </div>
      <div class="badge-input-row">
        <div class="badge-input-group"><label>Contacto - Nombre</label><input type="text" name="contact_name"></div>
        <div class="badge-input-group"><label>Contacto - Teléfono</label><input type="text" name="contact_phone"></div>
        <div class="badge-input-group"><label>Contacto - Correo</label><input type="email" name="contact_email"></div>
      </div>
      <button type="submit" class="golden-btn golden-btn-primary" style="width:auto; padding:0.7rem 2rem;">Crear cliente</button>
    </form>

    <div id="searchResults"></div>
    <div id="tenantsList" style="margin-top: 1.5rem;"></div>
    {% endif %}

  </div>
</main>

<datalist id="countryList"></datalist>
<datalist id="coordinatorList"></datalist>

<script>
const staffRole = "{{ staff_role }}";
const isAdmin = staffRole === "admin" || staffRole === "super_admin";
const canManageTenants = ["coordinador", "admin", "super_admin"].includes(staffRole);
const simpleEventListRole = ["digitador", "cliente"].includes(staffRole);

function fmtDate(d) { return d ? new Date(d).toLocaleDateString() : "-"; }

const STATUS_LABELS = { creado: "Creado", en_proceso: "En Proceso", finalizado: "Finalizado" };

// ---------- Datos de apoyo para los selectores ----------
const COUNTRIES = ["Colombia","México","Argentina","Chile","Perú","Ecuador","Venezuela","Bolivia","Paraguay","Uruguay","Brasil","Panamá","Costa Rica","Guatemala","Honduras","El Salvador","Nicaragua","República Dominicana","Cuba","Puerto Rico","España","Estados Unidos","Canadá","Francia","Alemania","Italia","Reino Unido","Portugal","Países Bajos","Bélgica","Suiza","China","Japón","Corea del Sur","India","Australia"];
document.getElementById("countryList").innerHTML = COUNTRIES.map(c => `<option value="${c}">`).join("");

let coordinatorsByLabel = {};
async function loadCoordinatorOptions() {
  if (!canManageTenants) return;
  const res = await fetch("/api/staff/coordinators");
  const coords = await res.json();
  coordinatorsByLabel = {};
  document.getElementById("coordinatorList").innerHTML = coords.map(c => {
    const label = `${c.full_name || c.username} (${c.username})`;
    coordinatorsByLabel[label] = c.id;
    return `<option value="${label}">`;
  }).join("");
}

// ---------- Vista digitador ----------
async function loadMyEvents() {
  const res = await fetch("/api/my-events");
  const events = await res.json();
  const el = document.getElementById("myEventsList");
  if (!el) return;
  if (events.length === 0) {
    el.innerHTML = '<p style="color:#888;">No tienes eventos autorizados todavía. Pide a un coordinador que te asigne desde el evento.</p>';
    return;
  }
  el.innerHTML = events.map(e => `
    <div class="tenant-card"><div class="tenant-head" style="cursor:default;">
      <div>
        <h3>${e.name}</h3>
        <div class="meta">${e.location || ""} ${e.city ? "· " + e.city : ""} · ${fmtDate(e.start_date)}</div>
      </div>
      <a class="small-btn primary" href="/kiosk/${e.id}">Ingresar →</a>
    </div></div>
  `).join("");
}

// ---------- Búsqueda general ----------
function eventResultCard(e) {
  return `
    <div class="tenant-card"><div class="tenant-head" style="cursor:default;">
      <div>
        <h3>${e.name} ${e.event_code ? `<span style="color:#aaa; font-weight:400;">(${e.event_code})</span>` : ""}</h3>
        <div class="meta">${e.tenant_name} · ${e.city || ""} ${e.country ? ", " + e.country : ""} · ${fmtDate(e.start_date)} <span class="status-pill status-${e.status}">${STATUS_LABELS[e.status] || e.status}</span></div>
      </div>
      <a class="small-btn primary" href="/kiosk/${e.id}">Ingresar →</a>
    </div></div>
  `;
}

let searchTimer = null;
const searchBox = document.getElementById("searchBox");
if (searchBox) {
  searchBox.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 250);
  });
}
async function runSearch() {
  const q = searchBox.value.trim();
  const resultsEl = document.getElementById("searchResults");
  const treeEl = document.getElementById("tenantsList");
  const tenantFormBtn = document.querySelector('[onclick*="newTenantForm"]');
  if (!q) {
    resultsEl.innerHTML = "";
    treeEl.style.display = "";
    return;
  }
  treeEl.style.display = "none";
  const res = await fetch(`/api/events/search?q=${encodeURIComponent(q)}`);
  const events = await res.json();
  resultsEl.innerHTML = events.length
    ? events.map(eventResultCard).join("")
    : '<p style="color:#888;">Sin resultados.</p>';
}

// ---------- Vista coordinador/admin/super_admin ----------
async function loadTenants() {
  if (!canManageTenants) return;
  const res = await fetch("/api/tenants");
  const tenantsData = await res.json();
  const el = document.getElementById("tenantsList");
  el.innerHTML = tenantsData.map(t => `
    <div class="tenant-card" data-tenant-id="${t.id}">
      <div class="tenant-head" data-action="toggle-tenant">
        <div>
          <h3>${t.name} <span style="color:#bbb; font-weight:400; font-size:0.75rem;">#${t.client_code}</span></h3>
          <div class="meta">${t.contact_name || "Sin contacto"} ${t.contact_phone ? "· " + t.contact_phone : ""}</div>
        </div>
        <span class="small-btn">Ver eventos</span>
      </div>
      <div class="tenant-body" data-tenant-body>
        <button type="button" class="small-btn primary" style="margin:1rem 0;" data-action="toggle-new-event">+ Nuevo evento</button>
        <form class="inline-form" data-new-event-form>
          <div class="badge-input-row">
            <div class="badge-input-group"><label>Código interno *</label><input type="text" name="event_code" required></div>
            <div class="badge-input-group"><label>Nombre del evento *</label><input type="text" name="name" required></div>
          </div>
          <div class="badge-input-row">
            <div class="badge-input-group"><label>Fecha inicio *</label><input type="date" name="start_date" required></div>
            <div class="badge-input-group"><label>Fecha fin *</label><input type="date" name="end_date" required></div>
            <div class="badge-input-group"><label>Fecha montaje *</label><input type="date" name="setup_date" required></div>
          </div>
          <div class="badge-input-row">
            <div class="badge-input-group"><label>Hora inicio evento *</label><input type="text" class="clock-time" name="event_time_start" required></div>
            <div class="badge-input-group"><label>Hora fin evento *</label><input type="text" class="clock-time" name="event_time_end" required></div>
          </div>
          <div class="badge-input-row">
            <div class="badge-input-group"><label>Hora inicio montaje *</label><input type="text" class="clock-time" name="setup_time_start" required></div>
            <div class="badge-input-group"><label>Hora fin montaje *</label><input type="text" class="clock-time" name="setup_time_end" required></div>
          </div>
          <div class="badge-input-row">
            <div class="badge-input-group"><label>País *</label><input type="text" class="country-field" name="country" list="countryList" required autocomplete="off"></div>
            <div class="badge-input-group"><label>Ciudad *</label><input type="text" class="city-field" name="city" list="cityList-${t.id}" required autocomplete="off"></div>
          </div>
          <datalist id="cityList-${t.id}"></datalist>
          <div class="badge-input-row">
            <div class="badge-input-group"><label>Lugar *</label><input type="text" name="location" required></div>
            <div class="badge-input-group"><label>Dirección *</label><input type="text" name="address" required></div>
          </div>
          <div class="badge-input-row">
            <div class="badge-input-group" style="min-width:100%;">
              <label>Coordinador asignado *</label>
              <input type="text" name="coordinator_label" list="coordinatorList" required autocomplete="off" placeholder="Escribe para buscar...">
            </div>
          </div>
          <div class="badge-input-row">
            <div class="badge-input-group" style="min-width:100%;"><label>Observaciones</label><input type="text" name="notes"></div>
          </div>
          <button type="submit" class="golden-btn golden-btn-primary" style="width:auto; padding:0.6rem 1.8rem;">Crear evento</button>
        </form>
        <div data-events-container></div>
      </div>
    </div>
  `).join("");

  el.querySelectorAll(".clock-time").forEach((input) => attachClockPicker(input));
  el.querySelectorAll(".country-field").forEach((input) => {
    input.addEventListener("change", () => updateCityOptions(input));
  });
}

async function updateCityOptions(countryInput) {
  const form = countryInput.closest("form");
  const cityDatalist = form.querySelector("datalist");
  const country = countryInput.value.trim();
  if (!country) { cityDatalist.innerHTML = ""; return; }
  const res = await fetch(`/api/cities?country=${encodeURIComponent(country)}`);
  const cities = res.ok ? await res.json() : [];
  cityDatalist.innerHTML = cities.map(c => `<option value="${c}">`).join("");
}

async function toggleTenant(tenantId, card) {
  const body = card.querySelector("[data-tenant-body]");
  body.classList.toggle("open");
  if (body.classList.contains("open")) loadEventsForTenant(tenantId, card);
}

// Delegación de eventos: #tenantsList nunca se reemplaza a sí mismo, solo su contenido, así que
// un único listener aquí sobrevive cada re-render de loadTenants()/loadEventsForTenant(). Evita
// depender de atributos onclick/onsubmit inline sobre HTML inyectado por innerHTML.
const tenantsListEl = document.getElementById("tenantsList");
if (tenantsListEl) {
  tenantsListEl.addEventListener("click", (e) => {
    const toggleHead = e.target.closest('[data-action="toggle-tenant"]');
    if (toggleHead) {
      const card = toggleHead.closest(".tenant-card");
      toggleTenant(card.dataset.tenantId, card);
      return;
    }
    const toggleNewEvent = e.target.closest('[data-action="toggle-new-event"]');
    if (toggleNewEvent) {
      toggleNewEvent.closest(".tenant-body").querySelector("[data-new-event-form]").classList.toggle("open");
      return;
    }
    const deleteBtn = e.target.closest("[data-delete-event]");
    if (deleteBtn) { deleteEvent(deleteBtn.dataset.deleteEvent, deleteBtn.dataset.eventName, deleteBtn.dataset.eventStatus, deleteBtn); return; }
  });

  tenantsListEl.addEventListener("change", async (e) => {
    const select = e.target.closest("[data-status-select]");
    if (!select) return;
    const newStatus = select.value;
    const previousStatus = Array.from(select.options).find(o => o.defaultSelected)?.value;
    const confirmed = await showConfirm(`¿Cambiar el estado del evento a "${STATUS_LABELS[newStatus]}"?`);
    if (!confirmed) { select.value = previousStatus; return; }
    await setEventStatus(select.dataset.eventId, newStatus, select);
  });

  tenantsListEl.addEventListener("submit", (e) => {
    const form = e.target.closest("[data-new-event-form]");
    if (!form) return;
    e.preventDefault();
    const tenantId = form.closest(".tenant-card").dataset.tenantId;
    createEvent(form, tenantId);
  });
}

async function loadEventsForTenant(tenantId, card) {
  const res = await fetch(`/api/events?tenant_id=${tenantId}`);
  const events = await res.json();
  const el = card.querySelector("[data-events-container]");
  if (events.length === 0) { el.innerHTML = '<p style="color:#888; font-size:0.85rem;">Sin eventos todavía.</p>'; return; }
  el.innerHTML = events.map(e => `
    <div class="event-row">
      <div>
        <div class="event-name">${e.name} ${e.event_code ? `<span style="color:#aaa; font-weight:400;">(${e.event_code})</span>` : ""}</div>
        <div class="event-meta">${e.location || ""} ${e.city ? "· " + e.city : ""} · ${fmtDate(e.start_date)} · Coordinador: ${e.coordinator_name || "-"} <span class="status-pill status-${e.status}">${STATUS_LABELS[e.status] || e.status}</span></div>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <a class="small-btn primary" href="/kiosk/${e.id}">Ingresar</a>
        <select class="small-btn" data-status-select data-event-id="${e.id}" style="cursor:pointer;">
          ${Object.entries(STATUS_LABELS).map(([value, label]) =>
            `<option value="${value}" ${value === e.status ? "selected" : ""}>${label}</option>`
          ).join("")}
        </select>
        ${isAdmin ? `<button type="button" class="small-btn danger" data-delete-event="${e.id}" data-event-name="${e.name.replace(/"/g, "&quot;")}" data-event-status="${e.status}">Eliminar</button>` : ""}
      </div>
    </div>
  `).join("");
}

async function createEvent(form, tenantId) {
  const formData = new FormData(form);
  const payload = Object.fromEntries(formData.entries());
  payload.tenant_id = tenantId;

  const coordinatorId = coordinatorsByLabel[payload.coordinator_label];
  if (!coordinatorId) {
    showToast("Selecciona un coordinador válido de la lista.", "error");
    return;
  }
  payload.coordinator_staff_id = coordinatorId;
  delete payload.coordinator_label;

  const res = await fetch("/api/events", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload),
  });
  if (res.ok) {
    form.reset();
    form.classList.remove("open");
    const card = form.closest(".tenant-card");
    loadEventsForTenant(tenantId, card);
    showToast("Evento creado", "success");
  } else {
    const err = await res.json();
    showToast(err.detail || "No se pudo crear el evento", "error");
  }
}

async function setEventStatus(eventId, status, btn) {
  const res = await fetch(`/api/events/${eventId}`, {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify({status})});
  const card = btn.closest(".tenant-card");
  loadEventsForTenant(card.dataset.tenantId, card);
  showToast(res.ok ? `Evento pasó a "${STATUS_LABELS[status]}"` : "No se pudo actualizar el evento", res.ok ? "success" : "error");
}

async function deleteEvent(eventId, name, status, btn) {
  const confirmed = await showConfirm(
    `¿Está seguro que quiere eliminar el evento "${name}"?<br><br>` +
    `Recuerde que este evento está en estado <strong>${STATUS_LABELS[status] || status}</strong>. ` +
    `Esta acción es permanente y no se puede deshacer.`
  );
  if (!confirmed) return;
  const res = await fetch(`/api/events/${eventId}`, {method: "DELETE"});
  const card = btn.closest(".tenant-card");
  loadEventsForTenant(card.dataset.tenantId, card);
  showToast(res.ok ? "Evento eliminado" : "No se pudo eliminar el evento", res.ok ? "success" : "error");
}

const newTenantForm = document.getElementById("newTenantForm");
if (newTenantForm) {
  newTenantForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const payload = Object.fromEntries(new FormData(ev.target).entries());
    const res = await fetch("/api/tenants", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload),
    });
    if (res.ok) { ev.target.reset(); ev.target.classList.remove("open"); loadTenants(); showToast("Cliente creado", "success"); }
    else { showToast("No se pudo crear el cliente", "error"); }
  });
}

if (simpleEventListRole) {
  loadMyEvents();
} else {
  loadCoordinatorOptions();
  loadTenants();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | GoldenWeb 2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    {% include "_gw_head.html" %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/gw-inicio.css') }}">
    <script src="{{ url_for('static', path='js/toast.js') }}"></script>
    <script src="{{ url_for('static', path='js/idle-session.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
    <script src="{{ url_for('static', path='js/dashboard.js') }}" data-icons="{{ url_for('static', path='img/icons.svg') }}" defer></script>
</head>
<body class="gw-page gw-shell">
<!-- Sin menú lateral: digitador/cliente son cuentas temporales sin panel (Sprint 2.3, 2026-09-16)
     — este template ya solo renderiza para ellos, coordinador+ se redirige a /clientes desde "/". -->
<a class="gw-skip" href="#contenido">Ir al contenido</a>
<header class="golden-header">
  <div class="golden-header-container">
    <a href="/" class="golden-logo">
      <img src="{{ url_for('static', path='img/logo-golden.png') }}" alt="Logo de Golden Eventos y Logística">
    </a>
    <nav class="golden-nav" aria-label="Sesión">
      {% include "_gw_theme_toggle.html" %}
      <a href="/configuracion" class="gw-btn gw-btn--ghost gw-btn--sm" aria-label="Configuración (Apariencia)" title="Configuración (Apariencia)">
        <svg class="gw-icon" aria-hidden="true"><use href="{{ url_for('static', path='img/icons.svg') }}#i-settings"/></svg>
      </a>
      <span class="gw-shell__who" title="{{ staff_name }} ({{ staff_role }})">{{ staff_name }} ({{ staff_role }})</span>
      <form action="/logout" method="post">
        <button type="submit" class="gw-btn gw-btn--secondary gw-btn--sm">Salir</button>
      </form>
    </nav>
  </div>
</header>
<div class="golden-content-spacer"></div>

<main class="golden-main" id="contenido">
  <div class="gw-container gw-stack-lg">
    <div class="gw-page-head">
      <div class="gw-page-head__text">
        <p class="gw-eyebrow">Tus eventos</p>
        <h1 class="gw-page-head__title">Eventos autorizados</h1>
        <p class="gw-page-head__sub">1. Busca tu evento. 2. Mira su estado. 3. Pulsa «Entrar».</p>
      </div>
    </div>
    <div class="gw-field" id="eventSearchBox" hidden>
      <label class="gw-label" for="eventSearch">Buscar evento</label>
      <input class="gw-input" type="search" id="eventSearch" placeholder="Nombre, ciudad o lugar" autocomplete="off" spellcheck="false">
      <p class="gw-hint" id="eventSearchInfo" role="status" aria-live="polite"></p>
    </div>
    <div id="myEventsList" aria-busy="true">
      <p class="gw-hint">Cargando tus eventos...</p>
    </div>
  </div>
</main>
</body>
</html>
